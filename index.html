<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bài thi Online</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
}

#timer{
    position:fixed;
    top:10px;
    right:10px;
    background:#d60000;
    color:white;
    padding:10px 20px;
    font-size:30px;
    border-radius:8px;
    z-index:9999;
}

iframe{
    margin-top:60px;
}
</style>

</head>
<body>

<div id="timer">20:00</div>

<iframe
src="https://forms.gle/zjrP1v5c1tz911tt9"
width="100%"
height="2500"
frameborder="0">
</iframe>

<script>

let timeLeft = 20 * 60;

const countdown = setInterval(() => {

    let minutes = Math.floor(timeLeft / 60);
    let seconds = timeLeft % 60;

    document.getElementById("timer").innerHTML =
        minutes + ":" + (seconds < 10 ? "0" : "") + seconds;

    if(timeLeft <= 0){
        clearInterval(countdown);
        alert("Đã hết thời gian làm bài!");
        window.location.href="https://google.com";
    }

    timeLeft--;

},1000);

</script>

</body>
</html>
